name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.2.0+4'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BUILD_NAME="${VERSION%%+*}"
          if [[ "$VERSION" == *+* ]]; then
            BUILD_NUMBER="${VERSION##*+}"
          else
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3+4" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          NB_SERVER: ${{ secrets.NB_SERVER }}
          NB_TOKEN: ${{ secrets.NB_TOKEN }}
        run: |
          flutter build windows --release \
            --build-name='${{ steps.version.outputs.build_name }}' \
            --build-number='${{ steps.version.outputs.build_number }}' \
            --dart-define=NB_SERVER="$NB_SERVER" \
            --dart-define=NB_TOKEN="$NB_TOKEN"

      # 把 VC++ 运行库放进程序目录，没装过运行库的电脑也能直接打开
      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $out -ErrorAction Stop
          }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Package zip
        id: package
        shell: pwsh
        run: |
          $name = "NelsonBox-Windows-${{ steps.version.outputs.tag }}.zip"
          $dir = "NelsonBox"
          Copy-Item -Recurse "build\windows\x64\runner\Release" $dir
          Compress-Archive -Path $dir -DestinationPath "..\$name"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NelsonBox-Windows-${{ steps.version.outputs.tag }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

      # Android 和 Windows 两个流程同时跑，谁先到谁创建 Release，另一个只上传文件
      - name: Create GitHub Release and upload zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.package.outputs.name }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        working-directory: ${{ github.workspace }}
        run: |
          FLAGS=(--title "NelsonBox $TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          for i in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$FILE" --clobber && exit 0
            else
              gh release create "$TAG" "$FILE" "${FLAGS[@]}" && exit 0
            fi
            sleep 10
          done
          exit 1
