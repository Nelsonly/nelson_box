<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NelsonBox 剪贴板</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/clip.css" />
</head>
<body>
  <header>
    <h1>NelsonBox</h1>
    <button id="status" class="pill" title="在线设备">连接中...</button>
  </header>

  <main>
    <!-- 登录 -->
    <section id="login" class="card" hidden>
      <h2>输入访问令牌</h2>
      <form id="login-form">
        <input id="token-input" type="password" placeholder="令牌" autocomplete="current-password" />
        <button type="submit" class="primary">连接</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <div id="app" hidden>
      <!-- 发送 -->
      <section class="card">
        <textarea id="input" rows="4" placeholder="粘贴或输入内容，发送到所有设备"></textarea>
        <div class="row">
          <span id="size-hint" class="muted"></span>
          <button id="send" class="primary">发送</button>
        </div>
      </section>

      <!-- 在线设备 -->
      <section id="devices" class="card" hidden>
        <h2>在线设备</h2>
        <ul id="device-list"></ul>
      </section>

      <!-- 历史 -->
      <section class="card">
        <div class="row">
          <h2>剪贴板记录</h2>
          <button id="clear" class="link">清空</button>
        </div>
        <ul id="history"></ul>
      </section>

      <p class="muted center"><button id="logout" class="link">退出登录</button></p>
    </div>
  </main>

  <div id="toast"></div>
  <script src="/static/clip.js"></script>
</body>
</html>
