<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NelsonBox 剪贴板</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/clip.css" />
</head>
<body>
  <header>
    <h1>NelsonBox</h1>
    <button id="status" class="pill" title="在线设备">连接中...</button>
  </header>

  <main>
    <!-- 登录 -->
    <section id="login" class="card" hidden>
      <h2>输入访问令牌</h2>
      <form id="login-form">
        <input id="token-input" type="password" placeholder="令牌" autocomplete="current-password" />
        <button type="submit" class="primary">连接</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <div id="app" hidden>
      <nav class="tabs">
        <button class="tab active" data-tab="clip">剪贴板</button>
        <button class="tab" data-tab="files">文件</button>
        <button class="tab" data-tab="ai">AI</button>
      </nav>

      <div id="tab-clip">
      <!-- 发送 -->
      <section class="card">
        <textarea id="input" rows="4" placeholder="粘贴或输入内容，发送到所有设备"></textarea>
        <div class="row">
          <span id="size-hint" class="muted"></span>
          <button id="send" class="primary">发送</button>
        </div>
      </section>

      <!-- 在线设备 -->
      <section id="devices" class="card" hidden>
        <h2>在线设备</h2>
        <ul id="device-list"></ul>
      </section>

      <!-- 历史 -->
      <section class="card">
        <div class="row">
          <h2>剪贴板记录</h2>
          <button id="clear" class="link">清空</button>
        </div>
        <ul id="history"></ul>
      </section>
      </div>

      <div id="tab-files" hidden>
        <section class="card">
          <div class="row target-row">
            <span>发送到</span>
            <select id="target"></select>
          </div>
          <label id="dropzone" class="dropzone">
            <input id="file-input" type="file" multiple hidden />
            <span>点击选择文件，或把文件拖到这里</span>
            <span class="muted">设备之间直接传输，不经过服务器；对方需要在线</span>
          </label>
        </section>
        <section class="card">
          <h2>传输记录</h2>
          <ul id="transfers"></ul>
        </section>
      </div>

      <div id="tab-ai" hidden>
        <div id="ai-layout" class="ai-layout">
          <aside class="card ai-side">
            <div class="row">
              <h2>对话</h2>
              <button id="ai-new" class="link">＋ 新对话</button>
            </div>
            <ul id="ai-conv-list"></ul>
          </aside>
          <section class="card ai-main">
            <div class="row ai-head">
              <button id="ai-toggle-list" class="link">☰</button>
              <strong id="ai-title" class="ai-title">新对话</strong>
              <span id="ai-host" class="pill">…</span>
            </div>
            <div class="ai-options">
              <select id="ai-engine" title="AI 工具"></select>
              <select id="ai-project" title="项目"></select>
              <select id="ai-model" title="模型"></select>
              <select id="ai-effort" title="推理强度"></select>
              <select id="ai-mode" title="权限">
                <option value="ask">只读问答</option>
                <option value="edit">可修改</option>
              </select>
              <input id="ai-passcode" type="password" placeholder="编辑口令" autocomplete="off" hidden />
            </div>
            <div id="ai-mode-hint" class="muted"></div>
            <div id="ai-messages" class="ai-messages"></div>
            <div class="ai-input-row">
              <textarea id="ai-input" rows="2"></textarea>
              <button id="ai-send" class="primary">发送</button>
            </div>
          </section>
        </div>
      </div>

      <p class="muted center"><button id="logout" class="link">退出登录</button></p>
    </div>
  </main>

  <div id="toast"></div>
  <script src="/static/p2p.js"></script>
  <script src="/static/ai.js"></script>
  <script src="/static/clip.js"></script>
</body>
</html>
